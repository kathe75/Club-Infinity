<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel administrativo - Club Infinity</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenedor">
        <h1>Club Infinity</h1>
        <h2>Panel administrativo</h2>

        
        <div id="seccion-login" style="max-width: 400px; margin-top: 20px;">
            <h3>Iniciar Sesión</h3>
            <form onsubmit="realizarLogin(event)">
                <label for="usuario">Correo:</label>
                <input type="email" id="usuario" required style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">

                <label for="clave">Contraseña:</label>
                <input type="password" id="clave" required style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">

                <button type="submit" class="boton" style="width: 100%;">Entrar</button>
            </form>
            <p id="mensaje-login" style="color: red; margin-top: 10px;"></p>
        </div>

       
        <div id="seccion-panel" style="display: none;">
            <button class="boton" onclick="cerrarSesion()" style="margin-bottom: 20px;">
                Cerrar sesión
            </button>

            <h2>Solicitudes recibidas</h2>

            <div id="lista-solicitudes">
                Cargando solicitudes...
            </div>
        </div>
    </main>

    <script src="admin.js"></script>

</body>
</html>
